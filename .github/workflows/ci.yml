name: CSGA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: csga-ci-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, mbstring, openssl, pdo, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Resolve and lock Composer dependencies
        run: composer update --prefer-dist --no-interaction --with-all-dependencies --no-scripts

      - name: Discover Laravel packages
        run: php artisan package:discover --ansi

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan vendor:publish --provider="Laravel\Ai\AiServiceProvider" --force --no-interaction
          php artisan config:clear

      - name: Run PHP tests
        run: php artisan test --compact

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Commit refreshed Composer lock on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "chore: refresh composer lock [skip ci]"
            git push
          fi
